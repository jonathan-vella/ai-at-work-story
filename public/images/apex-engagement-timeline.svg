<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1352" role="img" aria-labelledby="ax-title ax-desc" width="100%" preserveAspectRatio="xMidYMin meet">
  <title id="ax-title">Anonymized customer engagement with APEX</title>
  <desc id="ax-desc">Four steps in order. 1, Azure discovery and a workload diagram, compared with the customer's diagram: it matched. 2, a Well-Architected assessment compared with Azure Advisor: every relevant finding I checked appeared in the assessment. 3, assessment of the existing Terraform and synthesis of workload requirements including SLA, RTO, RPO and compliance. 4, updated Azure Verified Modules-based Terraform for another region. Below, three separate timings: under 18 hours elapsed to completed Terraform, including AI processing and waiting; about 6 hours of my hands-on time; and a successful deployment on day three, a separate, later milestone that is not part of the 18 hours. A note summarizes customer-reported feedback: the customer told me that what we accomplished together in three days was something they had been trying to do for about six months. They also said the engagement showed them how they could use AI more efficiently. This is customer-reported experience from one anonymized engagement, not a controlled benchmark or proof of universal accuracy.</desc>
  <style>
    text{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:#14213D}
    .h{font-size:22px;font-weight:700}
    .t{font-size:19px;font-weight:700}
    .b{font-size:16.5px}
    .s{font-size:16.5px;fill:#3A4556}
    .step{fill:#E8EEF7;stroke:#14213D;stroke-width:2}
    .t1{fill:#FFFFFF;stroke:#14213D;stroke-width:2}
    .t2{fill:#FFFFFF;stroke:#0B6E75;stroke-width:2.5;stroke-dasharray:7 4}
    .t3{fill:#F1EAF8;stroke:#5B3A8C;stroke-width:2}
    .t3b{fill:none;stroke:#5B3A8C;stroke-width:2}
    .n{font-size:16.5px;font-weight:700;fill:#FFFFFF;text-anchor:middle}
    .arr{stroke:#14213D;stroke-width:2.5;fill:none}
  </style>
  <defs>
    <marker id="ax-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14213D"/></marker>
  </defs>
  <rect width="420" height="1352" fill="#F7F9FC"/>
  <text x="16" y="34" class="h">One anonymized engagement</text>

  <!-- 1 -->
  <rect x="16" y="52" width="388" height="124" rx="10" class="step"/>
  <circle cx="44" cy="82" r="14" fill="#14213D"/><text x="44" y="88" class="n">1</text>
  <text x="68" y="88" class="t">Azure discovery and diagram</text>
  <text x="32" y="114" class="b">Diagram of the deployed workload</text>
  <text x="32" y="136" class="b">Compared with the customer's</text>
  <text x="32" y="158" class="b">diagram: it matched</text>
  <line x1="210" y1="178" x2="210" y2="198" class="arr" marker-end="url(#ax-a)"/>

  <!-- 2 -->
  <rect x="16" y="202" width="388" height="124" rx="10" class="step"/>
  <circle cx="44" cy="232" r="14" fill="#14213D"/><text x="44" y="238" class="n">2</text>
  <text x="68" y="238" class="t">Well-Architected assessment</text>
  <text x="32" y="264" class="b">Compared with Azure Advisor</text>
  <text x="32" y="286" class="b">Every relevant finding I checked</text>
  <text x="32" y="308" class="b">appeared in the assessment</text>
  <line x1="210" y1="328" x2="210" y2="348" class="arr" marker-end="url(#ax-a)"/>

  <!-- 3 -->
  <rect x="16" y="352" width="388" height="124" rx="10" class="step"/>
  <circle cx="44" cy="382" r="14" fill="#14213D"/><text x="44" y="388" class="n">3</text>
  <text x="68" y="388" class="t">Terraform and requirements</text>
  <text x="32" y="414" class="b">Assess the existing Terraform;</text>
  <text x="32" y="436" class="b">synthesize workload requirements</text>
  <text x="32" y="458" class="b">(SLA, RTO, RPO, compliance)</text>
  <line x1="210" y1="478" x2="210" y2="498" class="arr" marker-end="url(#ax-a)"/>

  <!-- 4 -->
  <rect x="16" y="502" width="388" height="102" rx="10" class="step"/>
  <circle cx="44" cy="532" r="14" fill="#14213D"/><text x="44" y="538" class="n">4</text>
  <text x="68" y="538" class="t">Updated Terraform</text>
  <text x="32" y="564" class="b">Azure Verified Modules-based</text>
  <text x="32" y="586" class="b">Terraform for another region</text>

  <!-- timings -->
  <text x="16" y="656" class="h">Three separate timings</text>

  <rect x="16" y="672" width="388" height="122" rx="10" class="t1"/>
  <text x="32" y="702" class="t">Under 18 hours</text>
  <text x="32" y="728" class="b">Elapsed time to completed</text>
  <text x="32" y="750" class="b">Terraform, including AI</text>
  <text x="32" y="772" class="b">processing and waiting</text>

  <rect x="16" y="806" width="388" height="80" rx="10" class="t2"/>
  <text x="32" y="836" class="t">About 6 hours</text>
  <text x="32" y="862" class="b">My hands-on time</text>

  <rect x="16" y="898" width="388" height="122" rx="10" class="t3"/>
  <rect x="21" y="903" width="378" height="112" rx="7" class="t3b"/>
  <text x="36" y="932" class="t">Day 3</text>
  <text x="36" y="958" class="b">Successful deployment</text>
  <text x="36" y="980" class="s">A separate, later milestone,</text>
  <text x="36" y="1002" class="s">not part of the 18 hours</text>

  <!-- note -->
  <text x="16" y="1074" class="t">Read this with care</text>
  <text x="16" y="1102" class="b">The customer told me that what we</text>
  <text x="16" y="1124" class="b">accomplished together in three days</text>
  <text x="16" y="1146" class="b">was something they had been trying</text>
  <text x="16" y="1168" class="b">to do for about six months.</text>
  <text x="16" y="1204" class="b">They also said the engagement showed</text>
  <text x="16" y="1226" class="b">them how they could use AI more</text>
  <text x="16" y="1248" class="b">efficiently.</text>
  <text x="16" y="1284" class="s">Customer-reported experience from one</text>
  <text x="16" y="1306" class="s">anonymized engagement. Not a controlled</text>
  <text x="16" y="1328" class="s">benchmark or proof of universal accuracy.</text>
</svg>

