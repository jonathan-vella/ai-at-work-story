<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" role="img" aria-labelledby="tl-title tl-desc" width="100%" preserveAspectRatio="xMidYMin meet">
  <title id="tl-title">Tools I use</title>
  <desc id="tl-desc">A simple list of five tool names, shown as two rows of two and one centered final row: Microsoft Scout, GitHub Copilot, Visual Studio Code, GitHub Copilot App, and Microsoft Copilot.</desc>
  <style>
    text{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:#14213D}
    .h{font-size:19px;font-weight:700;fill:#3A4556}
    .p{font-size:16.5px;font-weight:600}
    .pill{fill:#FFFFFF;stroke:#5B6676;stroke-width:1.5}
  </style>
  <rect width="420" height="240" fill="#F7F9FC"/>
  <text x="16" y="32" class="h">Tools I use</text>
  <rect x="16" y="52" width="190" height="48" rx="24" class="pill"/><text x="111" y="82" class="p" text-anchor="middle">Microsoft Scout</text>
  <rect x="214" y="52" width="190" height="48" rx="24" class="pill"/><text x="309" y="82" class="p" text-anchor="middle">GitHub Copilot</text>
  <rect x="16" y="112" width="190" height="48" rx="24" class="pill"/><text x="111" y="142" class="p" text-anchor="middle">Visual Studio Code</text>
  <rect x="214" y="112" width="190" height="48" rx="24" class="pill"/><text x="309" y="142" class="p" text-anchor="middle">GitHub Copilot App</text>
  <rect x="115" y="172" width="190" height="48" rx="24" class="pill"/><text x="210" y="202" class="p" text-anchor="middle">Microsoft Copilot</text>
</svg>
