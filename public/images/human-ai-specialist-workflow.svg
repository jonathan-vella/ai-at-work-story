<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1238" role="img" aria-labelledby="wf-title wf-desc" width="100%" preserveAspectRatio="xMidYMin meet">
  <title id="wf-title">Human, AI and specialist workflow</title>
  <desc id="wf-desc">Six steps in order, top to bottom. 1, me: discover the business problem, why it needs solving, and how success is measured. 2, me: develop the technical architecture. 3, AI-assisted: use AI to assist with analysis, code and iteration. 4, me, human check: check outputs against requirements, Azure Policy constraints and available evidence. 5, specialist, when needed: for decisions beyond my expertise, consult an experienced application or data specialist. 6, qualified people: production approval stays with suitably qualified people, and I do not approve applications for production on my own. A key explains the border styles, and a note says passing builds and tests does not replace specialist judgment.</desc>
  <style>
    text{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:#14213D}
    .h{font-size:22px;font-weight:700}
    .tag{font-size:16.5px;font-weight:700;letter-spacing:.3px;fill:#3A4556}
    .t{font-size:19px;font-weight:700}
    .b{font-size:16.5px}
    .me{fill:#E8EEF7;stroke:#14213D;stroke-width:2}
    .chk{fill:#E8EEF7;stroke:#14213D;stroke-width:4.5}
    .ai{fill:#FFFFFF;stroke:#0B6E75;stroke-width:2.5;stroke-dasharray:7 4}
    .sp{fill:#F1EAF8;stroke:#5B3A8C;stroke-width:2}
    .sp2{fill:none;stroke:#5B3A8C;stroke-width:2}
    .num{fill:#14213D}
    .n{font-size:17px;font-weight:700;fill:#FFFFFF;text-anchor:middle}
    .arr{stroke:#14213D;stroke-width:2.5;fill:none}
  </style>
  <defs>
    <marker id="wf-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14213D"/></marker>
  </defs>
  <rect width="420" height="1238" fill="#F7F9FC"/>
  <text x="16" y="34" class="h">Human, AI and specialist workflow</text>

  <!-- 1 -->
  <rect x="16" y="56" width="388" height="136" rx="10" class="me"/>
  <circle cx="46" cy="124" r="16" class="num"/><text x="46" y="130" class="n">1</text>
  <text x="76" y="82" class="tag">ME</text>
  <text x="76" y="106" class="t">Discover</text>
  <text x="76" y="130" class="b">The business problem, why it</text>
  <text x="76" y="152" class="b">needs solving, and how success</text>
  <text x="76" y="174" class="b">is measured</text>
  <line x1="210" y1="194" x2="210" y2="216" class="arr" marker-end="url(#wf-a)"/>

  <!-- 2 -->
  <rect x="16" y="220" width="388" height="96" rx="10" class="me"/>
  <circle cx="46" cy="268" r="16" class="num"/><text x="46" y="274" class="n">2</text>
  <text x="76" y="246" class="tag">ME</text>
  <text x="76" y="270" class="t">Develop</text>
  <text x="76" y="294" class="b">The technical architecture</text>
  <line x1="210" y1="318" x2="210" y2="340" class="arr" marker-end="url(#wf-a)"/>

  <!-- 3 -->
  <rect x="16" y="344" width="388" height="114" rx="10" class="ai"/>
  <circle cx="46" cy="401" r="16" class="num"/><text x="46" y="407" class="n">3</text>
  <text x="76" y="370" class="tag">AI-ASSISTED</text>
  <text x="76" y="394" class="t">Use AI</text>
  <text x="76" y="418" class="b">To assist with analysis, code,</text>
  <text x="76" y="440" class="b">and iteration</text>
  <line x1="210" y1="460" x2="210" y2="482" class="arr" marker-end="url(#wf-a)"/>

  <!-- 4 -->
  <rect x="16" y="486" width="388" height="136" rx="10" class="chk"/>
  <circle cx="46" cy="554" r="16" class="num"/><text x="46" y="560" class="n">4</text>
  <text x="76" y="512" class="tag">ME  ·  HUMAN CHECK</text>
  <text x="76" y="536" class="t">Check the output</text>
  <text x="76" y="560" class="b">Against requirements, Azure</text>
  <text x="76" y="582" class="b">Policy constraints, and</text>
  <text x="76" y="604" class="b">available evidence</text>
  <line x1="210" y1="624" x2="210" y2="646" class="arr" marker-end="url(#wf-a)"/>

  <!-- 5 -->
  <rect x="16" y="650" width="388" height="136" rx="10" class="sp"/>
  <rect x="21" y="655" width="378" height="126" rx="7" class="sp2"/>
  <circle cx="46" cy="718" r="16" class="num"/><text x="46" y="724" class="n">5</text>
  <text x="76" y="678" class="tag">SPECIALIST · WHEN NEEDED</text>
  <text x="76" y="702" class="t">Specialist input</text>
  <text x="76" y="726" class="b">For decisions beyond my expertise,</text>
  <text x="76" y="748" class="b">consult an experienced application</text>
  <text x="76" y="770" class="b">or data specialist.</text>
  <line x1="210" y1="788" x2="210" y2="810" class="arr" marker-end="url(#wf-a)"/>

  <!-- 6 -->
  <rect x="16" y="814" width="388" height="158" rx="10" class="sp"/>
  <rect x="21" y="819" width="378" height="148" rx="7" class="sp2"/>
  <circle cx="46" cy="893" r="16" class="num"/><text x="46" y="899" class="n">6</text>
  <text x="76" y="842" class="tag">QUALIFIED PEOPLE</text>
  <text x="76" y="866" class="t">Production approval</text>
  <text x="76" y="890" class="b">It stays with suitably qualified</text>
  <text x="76" y="912" class="b">people. I do not approve</text>
  <text x="76" y="934" class="b">applications for production</text>
  <text x="76" y="956" class="b">on my own.</text>

  <!-- key -->
  <text x="16" y="1020" class="t">Key</text>
  <rect x="16" y="1036" width="44" height="28" rx="5" class="me"/>
  <text x="72" y="1057" class="b">Solid border: my work</text>
  <rect x="16" y="1076" width="44" height="28" rx="5" class="ai"/>
  <text x="72" y="1097" class="b">Dashed border: AI-assisted</text>
  <rect x="16" y="1116" width="44" height="28" rx="5" class="sp"/><rect x="20" y="1120" width="36" height="20" rx="3" class="sp2"/>
  <text x="72" y="1137" class="b">Double border: specialist and</text>
  <text x="72" y="1159" class="b">approval steps</text>
  <text x="16" y="1202" class="b">Passing builds and tests does not</text>
  <text x="16" y="1224" class="b">replace specialist judgment.</text>
</svg>

