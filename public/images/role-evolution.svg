<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 962" role="img" aria-labelledby="re-title re-desc" width="100%" preserveAspectRatio="xMidYMin meet">
  <title id="re-title">Practice the change</title>
  <desc id="re-desc">A top-to-bottom story in three stages: Use, Build, Scale. It starts with 2013, when I moved from on-premises to cloud-first work and learned I had made a change like this before. Stage 1, Use, May 2025: first useful results with AI. Lesson: start with one repeated task. Stage 2, Build, late 2025 to 2026: APEX, where AI prepares and humans decide. Lesson: turn repeated work into a workflow. Stage 3, Scale, the past nine months: webinars and bootcamps, with others delivering it too. Lesson: share it. A dashed frame around all three stages lists two guardrails: verify every output, and bring in specialists for decisions beyond my expertise. A dark band beneath says infrastructure expertise stays the foundation at every stage. A closing note says AI widens the work I take on and does not make me an expert in every specialty.</desc>
  <style>
    text{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:#14213d}
    .h{font-size:22px;font-weight:700}
    .t{font-size:19px;font-weight:700}
    .b{font-size:16.5px}
    .tag{font-size:16.5px;font-weight:700;letter-spacing:.3px}
    .teal{fill:#0b6e75}
    .w{fill:#ffffff}
    .card{fill:#ffffff;stroke:#14213d;stroke-width:2}
    .strip{fill:#e8eef8;stroke:#14213d;stroke-width:2}
    .frame{fill:#e8eef8;stroke:#0b6e75;stroke-width:2.5;stroke-dasharray:8 5}
    .pill{fill:#ffffff;stroke:#14213d;stroke-width:1.5}
    .num{fill:#14213d}
    .n{font-size:17px;font-weight:700;fill:#ffffff;text-anchor:middle}
    .arr{stroke:#14213d;stroke-width:2.5;fill:none}
  </style>
  <defs>
    <marker id="re-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14213d"/></marker>
  </defs>
  <rect width="420" height="962" fill="#f7f9fc"/>
  <text x="16" y="34" class="h">Practice the change</text>

  <!-- start strip -->
  <rect x="16" y="52" width="388" height="84" rx="10" class="strip"/>
  <text x="32" y="86" class="t">2013: on-premises → cloud-first</text>
  <text x="32" y="114" class="b">I made that change before.</text>
  <line x1="210" y1="138" x2="210" y2="162" class="arr" marker-end="url(#re-a)"/>

  <!-- guardrail frame spanning all stages -->
  <rect x="16" y="168" width="388" height="576" rx="12" class="frame"/>
  <text x="44" y="198" class="tag teal">GUARDRAILS · ALL STAGES</text>
  <circle cx="48" cy="219" r="3.5" fill="#14213d"/>
  <text x="60" y="225" class="b">Verify every output.</text>
  <circle cx="48" cy="241" r="3.5" fill="#14213d"/>
  <text x="60" y="247" class="b">Bring in specialists for decisions</text>
  <text x="60" y="269" class="b">beyond my expertise.</text>

  <!-- stage 1 -->
  <rect x="28" y="292" width="364" height="112" rx="10" class="card"/>
  <circle cx="52" cy="318" r="15" class="num"/><text x="52" y="324" class="n">1</text>
  <text x="76" y="324" class="tag">USE  ·  MAY 2025</text>
  <text x="44" y="358" class="t">First useful results with AI</text>
  <rect x="44" y="368" width="332" height="30" rx="15" class="pill"/>
  <text x="58" y="390" class="b">Start with one repeated task.</text>
  <line x1="210" y1="406" x2="210" y2="426" class="arr" marker-end="url(#re-a)"/>

  <!-- stage 2 -->
  <rect x="28" y="430" width="364" height="136" rx="10" class="card"/>
  <circle cx="52" cy="456" r="15" class="num"/><text x="52" y="462" class="n">2</text>
  <text x="76" y="462" class="tag">BUILD  ·  LATE 2025 TO 2026</text>
  <text x="44" y="496" class="t">APEX: AI prepares,</text>
  <text x="44" y="520" class="t">humans decide</text>
  <rect x="44" y="532" width="332" height="30" rx="15" class="pill"/>
  <text x="58" y="554" class="b">Turn repeated work into a workflow.</text>
  <line x1="210" y1="568" x2="210" y2="588" class="arr" marker-end="url(#re-a)"/>

  <!-- stage 3 -->
  <rect x="28" y="592" width="364" height="136" rx="10" class="card"/>
  <circle cx="52" cy="618" r="15" class="num"/><text x="52" y="624" class="n">3</text>
  <text x="76" y="624" class="tag">SCALE  ·  PAST NINE MONTHS</text>
  <text x="44" y="658" class="t">Webinars and bootcamps;</text>
  <text x="44" y="682" class="t">others deliver it too</text>
  <rect x="44" y="694" width="332" height="30" rx="15" class="pill"/>
  <text x="58" y="716" class="b">Share it.</text>

  <!-- foundation -->
  <rect x="16" y="772" width="388" height="84" rx="10" fill="#14213d"/>
  <text x="32" y="806" class="t w">Infrastructure expertise</text>
  <text x="32" y="832" class="b w">stays the foundation at every stage.</text>

  <text x="16" y="892" class="b">AI widens the work I take on.</text>
  <text x="16" y="916" class="b">It does not make me an expert</text>
  <text x="16" y="938" class="b">in every specialty.</text>
</svg>
